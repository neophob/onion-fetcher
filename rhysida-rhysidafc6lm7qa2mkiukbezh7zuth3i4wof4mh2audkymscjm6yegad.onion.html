<!doctype html>
<html lang="en" data-bs-theme="dark">
	<head>
		<title>Rhysida</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link href="./css/bootstrap.min.css" rel="stylesheet" />
		<link href="./css/viewer.min.css" rel="stylesheet" />
		<script type="text/javascript" src="./js/jquery-3.6.4.min.js"></script>
		<script type="text/javascript" src="./js/popper.min.js"></script>
		<script type="text/javascript" src="./js/bootstrap.bundle.min.js"></script>
		<script type="text/javascript" src="./js/viewer.min.js"></script>
		<style type="text/css">
			/*
			@font-face {
				font-family: Roadrage;
				src: url("./fonts/Roadrage.otf") format("opentype");
				font-weight: normal;
				font-style: normal;
			}
			.name {
				font-family: Roadrage;
			}
			*/
			@font-face {
				font-family: "Snake-Mix";
				src: url("./fonts/Snake-Mix.ttf.woff") format('woff'),
					url("./fonts/Snake-Mix.ttf.svg#Snake-Mix") format('svg'),
					url("./fonts/Snake-Mix.ttf.eot"),
					url("./fonts/Snake-Mix.ttf.eot?#iefix") format('embedded-opentype');
				font-weight: normal;
				font-style: normal;
			}
			.hidden_name {
				font-family: "Snake-Mix";
			}
			body:before {
				content: "";
				position: absolute;
				width: 45vw;
				height: 30vw;
				top: -5vw;
				left: -15vw;
				z-index: -1;
				background-image: url(/back.png);
				background-position: left top;
				background-repeat: no-repeat;
				background-size: contain;
				transform: rotate(-90deg);
			}
			.auctions {
				animation: auctions 2s linear infinite;
			}

			@keyframes auctions {
				50% {
					box-shadow: 0 0 30px #dc3545;
				}
			}
			.error {
				animation: shake 0.2s ease-in-out 0s 2;
				box-shadow: 0 0 0.5em red;
			}
			@keyframes shake {
				0% { margin-left: 0rem; }
				25% { margin-left: 0.5rem; }
				75% { margin-left: -0.5rem; }
				100% { margin-left: 0rem; }
			}
			.r_back {
				background-color: #6db8ec !important;
			}
			.auction_captcha_holder img {
				max-width: 100%;
			}
		</style>
	</head>
	<body>
		<div class="container mb-5">
